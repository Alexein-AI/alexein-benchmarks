<svg xmlns="http://www.w3.org/2000/svg" width="880" height="304" viewBox="0 0 880 304" role="img" aria-labelledby="title desc"><title id="title">A question sees only what came before it</title><desc id="desc">Every item is added in time order, with its own date. A question is asked once everything dated before it has been added and processed, and before anything dated on or after it is added.</desc><style>text{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1d1d20}.eyebrow{font-size:12.5px;fill:#6e6e73;font-weight:500}.title{font-size:21px;font-weight:600;fill:#0a0a0a;letter-spacing:-0.01em}.lead{font-size:13.5px;fill:#6e6e73}.legend{font-size:12.5px;fill:#6e6e73}.panel{font-size:12.5px;font-weight:600;fill:#1d1d20}.name{font-size:13px}.aside{font-size:12px;fill:#6e6e73}.value{font-size:13px;fill:#6e6e73;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}.ours{font-weight:600;fill:#0a0a0a}.row .value{stroke:#f5f5f4}.scale{font-size:11px;fill:#86868b;font-variant-numeric:tabular-nums}.note{font-size:12px;fill:#6e6e73}.gain{font-size:17px;font-weight:600;fill:#0a0a0a}.figure{font-size:40px;font-weight:600;fill:#0a0a0a;letter-spacing:-0.02em}.label{font-size:14px;font-weight:500;fill:#0a0a0a}</style><rect x="0.5" y="0.5" width="879" height="303" rx="16" fill="#ffffff" stroke="#e5e5e3"/><text x="32" y="46" class="eyebrow">How a run works</text><text x="32" y="76" class="title">A question sees only what came before it</text><text x="32" y="97" class="lead">Every item is added in time order, with its own date. A question is asked once everything dated before it</text><text x="32" y="118" class="lead">has been added and processed, and before anything dated on or after it is added.</text><rect x="40" y="219.5" width="800" height="1" fill="#e5e5e3"/><text x="97.1429" y="250" class="scale" text-anchor="middle">Mon</text><text x="211.429" y="25