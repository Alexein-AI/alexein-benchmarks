<svg xmlns="http://www.w3.org/2000/svg" width="880" height="414" viewBox="0 0 880 414" role="img" aria-labelledby="title desc"><title id="title">BEAM · 1M-token split · 700 questions: A million tokens a conversation, level with Mem0</title><desc id="desc">Mean score: Mem0 64.09; Alexein 63.49. Pass rate: Alexein 70.57%; Mem0 70.14%.</desc><style>text{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1d1d20}.eyebrow{font-size:12.5px;fill:#6e6e73;font-weight:500}.title{font-size:21px;font-weight:600;fill:#0a0a0a;letter-spacing:-0.01em}.lead{font-size:13.5px;fill:#6e6e73}.legend{font-size:12.5px;fill:#6e6e73}.panel{font-size:12.5px;font-weight:600;fill:#1d1d20}.name{font-size:13px}.aside{font-size:12px;fill:#6e6e73}.value{font-size:13px;fill:#6e6e73;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}.ours{font-weight:600;fill:#0a0a0a}.row .value{stroke:#f5f5f4}.scale{font-size:11px;fill:#86868b;font-variant-numeric:tabular-nums}.note{font-size:12px;fill:#6e6e73}.gain{font-size:17px;font-weight:600;fill:#0a0a0a}.figure{font-size:40px;font-weight:600;fill:#0a0a0a;letter-spacing:-0.02em}.label{font-size:14px;font-weight:500;fill:#0a0a0a}</style><rect x="0.5" y="0.5" width="879" height="413" rx="16" fill="#ffffff" stroke="#e5e5e3"/><text x="32" y="46" class="eyebrow">BEAM · 1M-token split · 700 questions</text><text x="32" y="76" class="title">A million tokens a conversation, level with Mem0</text><text x="32" y="97" class="lead">35 conversations of about a million tokens each, every one larger than GPT-5&#x27;s 400,000-token window. GPT-5</text><text x="32" y="118" class="lead">answers and judges, in Mem0&#x27;s published harness, no hints.</text><text x="32" y="148" class="panel">Mean score</text><g><text x="32" y="183.5" class="name">Mem0</text><path d="M332.0 173.0H780.0A4 4 0 0 1 784.0 177.0V181.0A4 4 0 0 1 780.0 185.0H332.0Z" fill="#f1f1f1"/><rect x="444.5" y="173" width="1" height="12" fill="#e0e0e0"/><rect x="557.5" y="173" width="1" height="12" fill="#e0e0e0"/><rect x="670.5" y="173" width="1" height="12" fill="#e0e0e0"/><path d="M332.0 173.0H617.7A4 4 0 0 1 621.7 177.0V181.0A4 4 0 0 1 617.7 185.0H332.0Z" fill="#bcbcbc"/><text x="630.687" y="183.5" class="value">64.09</text></g><g class="row"><rect x="20" y="195" width="840" height="28" rx="8" fill="#f5f5f4"/><text x="32" y="213.5" class="name ours">Alexein</text><path d="M332.0 203.0H780.0A4 4 0 0 1 784.0 207.0V211.0A4 4 0 0 1 780.0 215.0H332.0Z" fill="#f1f1f1"/><rect x="444.5" y="203" width="1" height="12" fill="#e0e0e0"/><rect x="557.5" y="203" width="1" height="12" fill="#e0e0e0"/><rect x="670.5" y="203" width="1" height="12" fill="#e0e0e0"/><path d="M332.0 203.0H615.0A4 4 0 0 1 619.0 207.0V211.0A4 4 0 0 1 615.0 215.0H332.0Z" fill="#0a0a0a"/><text x="627.975" y="213.5" class="value ours">63.49</text></g><text x="32" y="242" class="panel">Pass rate</text><g class="row"><rect x="20" y="259" width="840" height="28" rx="8" fill="#f5f5f4"/><text x="32" y="277.5" class="name ours">Alexein</text><path d="M332.0 267.0H780.0A4 4 0 0 1 784.0 271.0V275.0A4 4 0 0 1 780.0 279.0H332.0Z" fill="#f1f1f1"/><rect x="444.5" y="267" width="1" height="12" fill="#e0e0e0"/><rect x="557.5" y="267" width="1" height="12" fill="#e0e0e0"/><rect x="670.5" y="267" width="1" height="12" fill="#e0e0e0"/><path d="M332.0 267.0H647.0A4 4 0 0 1 651.0 271.0V275.0A4 4 0 0 1 647.0 279.0H332.0Z" fill="#0a0a0a"/><text x="659.976" y="277.5" class="value ours">70.57%</text></g><g><text x="32" y="307.5" class="name">Mem0</text><path d="M332.0 297.0H780.0A4 4 0 0 1 784.0 301.0V305.0A4 4 0 0 1 780.0 309.0H332.0Z" fill="#f1f1f1"/><rect x="444.5" y="297" width="1" height="12" fill="#e0e0e0"/><rect x="557.5" y="297" width="1" height="12" fill="#e0e0e0"/><rect x="670.5" y="297" width="1" height="12" fill="#e0e0e0"/><path d="M332.0 297.0H645.0A4 4 0 0 1 649.0 301.0V305.0A4 4 0 0 1 645.0 309.0H332.0Z" fill="#bcbcbc"/><text x="658.033" y="307.5" class="value">70.14%</text></g><text x="332" y="336" class="scale" text-anchor="middle">0</text><text x="445" y="336" class="scale" text-anchor="middle">25</text><text x="558" y="336" class="scale" text-anchor="middle">50</text><text x="671" y="336" class="scale" text-anchor="middle">75</text><text x="784" y="336" class="scale" text-anchor="middle">100</text><text x="32" y="366" class="note">Within a point on both: 0.60 on the mean, 0.43 on the pass rate. Alexein&#x27;s are self-reported; Mem0&#x27;s are from its</text><text x="32" y="384" class="note">published harness.</text></svg>
