<svg xmlns="http://www.w3.org/2000/svg" width="880" height="342" viewBox="0 0 880 342" role="img" aria-labelledby="title desc"><title id="title">Alexein&#x27;s benchmarks at a glance</title><desc id="desc">+58.0: points, same model, better memory. GPT-4.1-mini on MemoryAgentBench, facts that keep changing: 36.0 to 94.0. #1: memory framework on Microsoft&#x27;s RHELM. Ahead of memU, Mem0 and MemGPT on both tables, each reading with GPT-4.1-mini. 3.2×: the LoCoMo-Plus paper&#x27;s best memory. 55.4 against A-Mem&#x27;s 17.20. 70.57%: pass rate on BEAM&#x27;s million-token conversations. Level with Mem0&#x27;s 70.14%, in Mem0&#x27;s own harness.</desc><style>text{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1d1d20}.eyebrow{font-size:12.5px;fill:#6e6e73;font-weight:500}.title{font-size:21px;font-weight:600;fill:#0a0a0a;letter-spacing:-0.01em}.lead{font-size:13.5px;fill:#6e6e73}.legend{font-size:12.5px;fill:#6e6e73}.panel{font-size:12.5px;font-weight:600;fill:#1d1d20}.name{font-size:13px}.aside{font-size:12px;fill:#6e6e73}.value{font-size:13px;fill:#6e6e73;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}.ours{font-weight:600;fill:#0a0a0a}.row .value{stroke:#f5f5f4}.scale{font-size:11px;fill:#86868b;font-variant-numeric:tabular-nums}.note{font-size:12px;fill:#6e6e73}.gain{font-size:17px;font-weight:600;fill:#0a0a0a}.figure{font-size:40px;font-weight:600;fill:#0a0a0a;letter-spacing:-0.02em}.label{font-size:14px;font-weight:500;fill:#0a0a0a}</style><rect x="0.5" y="0.5" width="432" height="163" rx="16" fill="#f6f6f5" stroke="#e5e5e3"/><rect x="26" y="24" width="28" height="4" rx="2" fill="#c3ceff"/><text x="26" y="76" class="figure">+58.0</text><text x="26" y="102" class="label">points, same model, better memory</text><text x="26" y="124" class="note">GPT-4.1-mini on MemoryAgentBench, facts that keep</text><text x="26" y="142" class="note">changing: 36.0 to 94.0</text><rect x="447.5" y="0.5" width="432" height="163" rx="16" fill="#f6f6f5" stroke="#e5e5e3"/><rect x="473" y="24" width="28" height="4" rx="2" fill="#bfe7d2"/><text x="473" y="76" class="figure">#1</text><text x="473" y="102" class="label">memory framework on Microsoft&#x27;s RHELM</text><text x="473" y="124" class="note">Ahead of memU, Mem0 and MemGPT on both tables, each</text><text x="473" y="142" class="note">reading with GPT-4.1-mini</text><rect x="0.5" y="178.5" width="432" height="163" rx="16" fill="#f6f6f5" stroke="#e5e5e3"/><rect x="26" y="202" width="28" height="4" rx="2" fill="#ffd2bc"/><text x="26" y="254" class="figure">3.2×</text><text x="26" y="280" class="label">the LoCoMo-Plus paper&#x27;s best memory</text><text x="26" y="302" class="note">55.4 against A-Mem&#x27;s 17.20</text><rect x="447.5" y="178.5" width="432" height="163" rx="16" fill="#f6f6f5" stroke="#e5e5e3"/><rect x="473" y="202" width="28" height="4" rx="2" fill="#dccaf5"/><text x="473" y="254" class="figure">70.57%</text><text x="473" y="280" class="label">pass rate on BEAM&#x27;s million-token conversations</text><text x="473" y="302" class="note">Level with Mem0&#x27;s 70.14%, in Mem0&#x27;s own harness</text></svg>
