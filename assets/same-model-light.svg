<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" viewBox="0 0 880 570" role="img" aria-labelledby="title desc"><title id="title">The same model scores higher with Alexein</title><desc id="desc">MemoryAgentBench, facts that keep changing: 36.0 reading everything, 94.0 with Alexein. RHELM, a year of chats, emails, documents: 33.9 reading everything, 48.5 with Alexein. LoCoMo, weeks of long conversations: 80.6 reading everything, 94.6 with Alexein. MemoryAgentBench, a whole detective novel: 56.3 reading everything, 66.2 with Alexein. MemoryAgentBench, one fact in a long history: 83.0 reading everything, 92.0 with Alexein.</desc><style>text{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1d1d20}.eyebrow{font-size:12.5px;fill:#6e6e73;font-weight:500}.title{font-size:21px;font-weight:600;fill:#0a0a0a;letter-spacing:-0.01em}.lead{font-size:13.5px;fill:#6e6e73}.legend{font-size:12.5px;fill:#6e6e73}.panel{font-size:12.5px;font-weight:600;fill:#1d1d20}.name{font-size:13px}.aside{font-size:12px;fill:#6e6e73}.value{font-size:13px;fill:#6e6e73;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}.ours{font-weight:600;fill:#0a0a0a}.row .value{stroke:#f5f5f4}.scale{font-size:11px;fill:#86868b;font-variant-numeric:tabular-nums}.note{font-size:12px;fill:#6e6e73}.gain{font-size:17px;font-weight:600;fill:#0a0a0a}.figure{font-size:40px;font-weight:600;fill:#0a0a0a;letter-spacing:-0.02em}.label{font-size:14px;font-weight:500;fill:#0a0a0a}</style><rect x="0.5" y="0.5" width="879" height="569" rx="16" fill="#ffffff" stroke="#e5e5e3"/><text x="32" y="46" class="eyebrow">Same model, better memory</text><text x="32" y="76" class="title">The same model scores higher with Alexein</text><text x="32" y="97" class="lead">Each pair is the same questions, the same scoring and the same answer model, GPT-4.1-mini: once with the</text><text x="32" y="118" class="lead">whole history in its context, once with what Alexein returns for the question.</text><path d="M32.0 141.0H44.0A4 4 0 0 1 48.0 145.0V147.0A4 4 0 0 1 44.0 151.0H32.0Z" fill="#dadada"/><path d="M32.5 141.5H44.0A3.5 3.5 0 0 1 47.5 145.0V147.0A3.5 3.5 0 0 1 44.0 150.5H32.5Z" fill="none" stroke="#acacac"/><text x="55" y="150" class="legend">GPT-4.1-mini, the whole history</text><path d="M294.0 141.0H306.0A4 4 0 0 1 310.0 145.0V147.0A4 4 0 0 1 306.0 151.0H294.0Z" fill="#0a0a0a"/><text x="317" y="150" class="legend">GPT-4.1-mini with Alexein</text><text x="848" y="174" class="scale" text-anchor="end">points</text><text x="32" y="199" class="name ours">MemoryAgentBench</text><text x="32" y="217" class="aside">Facts that keep changing</text><path d="M268.0 188.0H724.0A4 4 0 0 1 728.0 192.0V196.0A4 4 0 0 1 724.0 200.0H268.0Z" fill="#f1f1f1"/><rect x="382.5" y="188" width="1" height="12" fill="#e0e0e0"/><rect x="497.5" y="188" width="1" height="12" fill="#e0e0e0"/><rect x="612.5" y="188" width="1" height="12" fill="#e0e0e0"/><path d="M268.0 188.0H429.6A4 4 0 0 1 433.6 192.0V196.0A4 4 0 0 1 429.6 200.0H268.0Z" fill="#dadada"/><path d="M268.5 188.5H429.6A3.5 3.5 0 0 1 433.1 192.0V196.0A3.5 3.5 0 0 1 429.6 199.5H268.5Z" fill="none" stroke="#acacac"/><text x="442.6" y="198.5" class="value">36.0</text><path d="M268.0 206.0H724.0A4 4 0 0 1 728.0 210.0V214.0A4 4 0 0 1 724.0 218.0H268.0Z" fill="#f1f1f1"/><rect x="382.5" y="206" width="1" height="12" fill="#e0e0e0"/><rect x="497.5" y="206" width="1" height="12" fill="#e0e0e0"/><rect x="612.5" y="206" width="1" height="12" fill="#e0e0e0"/><path d="M268.0 206.0H696.4A4 4 0 0 1 700.4 210.0V214.0A4 4 0 0 1 696.4 218.0H268.0Z" fill="#0a0a0a"/><text x="709.4" y="216.5" class="value ours">94.0</text><text x="848" y="210" class="gain" text-anchor="end">+58.0</text><rect x="32" y="234" width="816" height="1" fill="#e5e5e3"/><text x="32" y="257" class="name ours">RHELM</text><text x="32" y="275" class="aside">A year of chats, emails